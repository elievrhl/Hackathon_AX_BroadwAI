name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: broadwai
          POSTGRES_PASSWORD: broadwai
          POSTGRES_DB: broadwai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U broadwai -d broadwai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://broadwai:broadwai@localhost:5432/broadwai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

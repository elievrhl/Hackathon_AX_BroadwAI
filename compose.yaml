services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: broadwai
      POSTGRES_PASSWORD: broadwai
      POSTGRES_DB: broadwai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadwai -d broadwai"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
